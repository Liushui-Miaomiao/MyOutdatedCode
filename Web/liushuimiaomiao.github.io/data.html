<!DOCTYPE html>

<html lang="zh-cn">
    <head>
        <script src="js/data.js" type="text/javascript"></script>
        <script src="js/util.js" type="text/javascript"></script>
        
        <script>header("文件分享");</script>
        <base target="_blank"/>
    </head>
    
    <body>
        <p><div id="tableDiv"></div></p>
        
        <script>
            addOnload(function() {
                // 获取 data_src 参数
                var data_src = getParameter("data_src");
                console.log("data_src = " + data_src);
                // 查找是否存在 data_src 的数据
                var data = json[data_src];
                
                // 参数错误或数据为空跳转 404 页面
                if (!data_src || !data) {
                    goto404();
                    
                    return;
                }
                
                var div = document.getElementById("tableDiv");
                var title = ["名称", "描述", "预览图", "下载地址"];
                createTableHead(div, title);
                
                // 把数据添加到表格
                addData(data);
            });
        </script>
        
        <p><a href="index.html" target="_self">主页</a></p>
        <p><hr/></p>
        <script>footer();</script>
    </body>
</html>
